<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 170">
  <!-- Aixa's Adventures: a clip-art adventurer's fedora resting on a little globe -->
  <defs>
    <radialGradient id="sea" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#7fd0f5"/><stop offset="1" stop-color="#2a7fc9"/></radialGradient>
    <linearGradient id="felt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a8774a"/><stop offset="1" stop-color="#6b4526"/></linearGradient>
  </defs>
  <!-- the globe -->
  <circle cx="120" cy="112" r="50" fill="url(#sea)" stroke="#173b5c" stroke-width="5"/>
  <path d="M86 95c10-8 22-6 28 1s4 16-6 19-14 10-22 6-12-18 0-26z" fill="#6cc04a" stroke="#2f6b21" stroke-width="3"/>
  <path d="M128 86c12-5 26 0 30 9s-2 15-10 15-10 9-18 8-14-12-10-20 2-8 8-12z" fill="#6cc04a" stroke="#2f6b21" stroke-width="3"/>
  <path d="M118 140c8-4 18-2 20 4s-6 9-14 9-12-9-6-13z" fill="#6cc04a" stroke="#2f6b21" stroke-width="3"/>
  <!-- a dotted flight path round it, with a little plane -->
  <path d="M60 128 C 70 60, 175 52, 182 110" fill="none" stroke="#fff" stroke-width="3.5" stroke-dasharray="2 8" stroke-linecap="round"/>
  <g transform="translate(182 112) rotate(100)"><path d="M0-9 L3 0 L12 4 L3 4 L2 11 L5 13 L-5 13 L-2 11 L-3 4 L-12 4 L-3 0 Z" fill="#fff" stroke="#173b5c" stroke-width="2"/></g>
  <!-- the fedora -->
  <ellipse cx="120" cy="66" rx="92" ry="20" fill="url(#felt)" stroke="#3b2414" stroke-width="5"/>
  <path d="M64 64 C 66 22, 92 10, 104 22 C 112 14, 128 14, 136 22 C 148 10, 174 22, 176 64 Z" fill="url(#felt)" stroke="#3b2414" stroke-width="5" stroke-linejoin="round"/>
  <path d="M104 22 C 112 34, 128 34, 136 22" fill="none" stroke="#3b2414" stroke-width="4" stroke-linecap="round"/>
  <path d="M66 50 C 100 60, 140 60, 174 50 L175 62 C 140 72, 100 72, 65 62 Z" fill="#c0392b" stroke="#3b2414" stroke-width="4" stroke-linejoin="round"/>
  <!-- a shine on the brim and a little compass-star feather -->
  <path d="M40 70 C 70 80, 110 82, 150 78" fill="none" stroke="#d9a877" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <g transform="translate(160 54)"><path d="M0-14 L4-4 L14 0 L4 4 L0 14 L-4 4 L-14 0 L-4-4 Z" fill="#ffd166" stroke="#3b2414" stroke-width="3" stroke-linejoin="round"/></g>
</svg>
